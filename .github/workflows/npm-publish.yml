name: publish

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Update npm for OIDC trusted publishing
        # OIDC trusted publishing requires npm 11.5.2+. npm 10.9.2 predates this
        # feature, so even though OIDC is configured on the npm registry, the
        # client falls back to the placeholder NODE_AUTH_TOKEN that
        # actions/setup-node@v4 injects (corresponding to a revoked NPM_TOKEN
        # secret) and fails with 404. See PRLT-1267.
        #
        # Pinned to 11.11.1: latest known-good version per local bisect.
        # 11.5.2 through 11.11.1 all have OIDC trusted publishing AND have
        # promise-retry bundled correctly. 11.12.0 introduced the bundling
        # regression that breaks `npm install -g` on GitHub runners (the
        # original PRLT-1266 incident); 11.12.1 is also broken.
        run: npm install -g npm@11.11.1

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "store-path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store-path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Prepack
        run: pnpm --filter @proletariat/cli prepack

      - name: Publish to npm
        run: cd apps/cli && npm publish --provenance --access public

      - name: Postpack
        run: pnpm --filter @proletariat/cli postpack

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Sync server.json version
        run: |
          VERSION=$(node -p "require('./apps/cli/package.json').version")
          cd apps/cli
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish to MCP Registry
        run: cd apps/cli && ../../mcp-publisher publish
