name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Native modules are automatically rebuilt during pnpm install
      # but we explicitly rebuild to ensure platform-specific binaries
      - name: Rebuild native modules
        run: pnpm rebuild better-sqlite3

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test
        env:
          # Use isolated database for tests
          PRLT_HQ_PATH: /tmp/prlt-test-${{ github.run_id }}

      - name: Verify CLI runs
        run: node apps/cli/bin/run.js --help

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run linter
        run: pnpm --filter @chrismcdermut/prlt lint:all
